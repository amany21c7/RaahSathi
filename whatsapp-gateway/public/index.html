<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaahSathi WhatsApp Gateway</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card-gateway {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 480px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }
    .qr-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin: 1.5rem 0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      min-height: 250px;
      min-width: 250px;
      position: relative;
    }
    .qr-container img {
      width: 220px;
      height: 220px;
      display: block;
    }
    .status-badge {
      font-size: 0.9rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
    }
    .status-connected {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }
    .status-scanning {
      background: rgba(234, 179, 8, 0.2);
      color: #facc15;
      border: 1px solid #eab308;
    }
  </style>
</head>
<body>
  <div class="card-gateway">
    <div class="mb-3">
      <i class="fa-brands fa-whatsapp text-success fs-1"></i>
    </div>
    <h3 class="fw-bold mb-1"><span style="color: #ff6b00;">Raah</span>Sathi WhatsApp Gateway</h3>
    <p class="text-secondary small mb-3">Scan with WhatsApp Linked Devices to send free lifetime OTPs</p>

    <div id="statusBadge" class="status-badge status-scanning mb-3">
      <i class="fa-solid fa-circle-notch fa-spin"></i> Checking connection...
    </div>

    <div id="qrBox" class="d-none">
      <div class="qr-container">
        <img id="qrImg" src="" alt="WhatsApp QR Code">
      </div>
      <p class="text-secondary small">
        Open WhatsApp on your phone &gt; Settings &gt; <strong>Linked Devices</strong> &gt; Link a Device &gt; Scan this QR.
      </p>
    </div>

    <div id="connectedBox" class="d-none my-4">
      <div class="text-success mb-3">
        <i class="fa-solid fa-circle-check fs-1"></i>
      </div>
      <h5 class="text-white">Gateway Connected & Ready!</h5>
      <p class="text-muted small" id="phoneText">Connected Phone: +91 XXXXX XXXXX</p>
      <button class="btn btn-outline-danger btn-sm mt-3" id="btnLogout">
        <i class="fa-solid fa-right-from-bracket me-1"></i> Disconnect / Change Number
      </button>
    </div>
  </div>

  <script>
    async function checkStatus() {
      try {
        const res = await fetch('/qr');
        const data = await res.json();

        if (data.isConnected) {
          document.getElementById('statusBadge').className = 'status-badge status-connected';
          document.getElementById('statusBadge').innerHTML = '<i class="fa-solid fa-circle"></i> Connected';
          document.getElementById('qrBox').classList.add('d-none');
          document.getElementById('connectedBox').classList.remove('d-none');
          document.getElementById('phoneText').innerText = 'Active Number: +' + (data.connectedPhone || 'WhatsApp User');
        } else if (data.qrDataUrl) {
          document.getElementById('statusBadge').className = 'status-badge status-scanning';
          document.getElementById('statusBadge').innerHTML = '<i class="fa-solid fa-qrcode"></i> Ready to Scan';
          document.getElementById('qrImg').src = data.qrDataUrl;
          document.getElementById('qrBox').classList.remove('d-none');
          document.getElementById('connectedBox').classList.add('d-none');
        } else {
          document.getElementById('statusBadge').className = 'status-badge status-scanning';
          document.getElementById('statusBadge').innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Generating QR...';
        }
      } catch (err) {
        document.getElementById('statusBadge').className = 'status-badge text-danger border border-danger';
        document.getElementById('statusBadge').innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Gateway Offline';
      }
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
      if (confirm('Are you sure you want to disconnect this WhatsApp number?')) {
        await fetch('/logout', { method: 'POST' });
        checkStatus();
      }
    });

    checkStatus();
    setInterval(checkStatus, 3000);
  </script>
</body>
</html>
